version: '3.8'

services:
  ambienttv:
    build: ./backend
    container_name: ambienttv
    ports:
      - "3000:3000"
    env_file:
      - ./backend/.env
    volumes:
      - ./backend/data:/app/data
      - ./backend/backups:/app/backups
      - ./web:/app/web  # serve web files from host
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Optional: Redis for rate limiting (if needed locally)
  # Comment out if you don't want Redis on Windows
  redis:
    image: redis:7-alpine
    container_name: ambienttv-redis
    ports:
      - "6379:6379"
    restart: unless-stopped
    volumes:
      - redis-data:/data

volumes:
  redis-data:

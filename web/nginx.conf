# AmbientTV — nginx config (alternative to server.mjs).
# Serve the built SPA from dist/ and reverse-proxy API + media to the Node backend.
#
#   apt install nginx  (or use the Dockerfile)
#   cp nginx.conf /etc/nginx/sites-enabled/ambienttv
#   nginx -t && systemctl reload nginx
#
# Build first:  npm run build   →  dist/

server {
    listen 80;
    server_name _;  # replace with your domain

    root /var/www/ambienttv/dist;
    index index.html;

    # Long-cache hashed assets, no-cache HTML (SPA)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # API + media → backend (default :3000)
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /media/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # SPA fallback for client-side routes
    location / {
        try_files $uri $uri/ /index.html;
    }
}

apiVersion: apps/v1
kind: Deployment
metadata:
  name: ambienttv-redis
  namespace: ambienttv
  labels:
    app: ambienttv-redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ambienttv-redis
  template:
    metadata:
      labels:
        app: ambienttv-redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
              name: redis
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "200m"
          livenessProbe:
            exec:
              command:
                - redis-cli
                - ping
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            exec:
              command:
                - redis-cli
                - ping
            initialDelaySeconds: 5
            periodSeconds: 5
          volumeMounts:
            - name: redis-data
              mountPath: /data
      volumes:
        - name: redis-data
          emptyDir: {}

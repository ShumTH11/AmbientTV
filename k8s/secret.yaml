apiVersion: v1
kind: Secret
metadata:
  name: ambienttv-secrets
  namespace: ambienttv
type: Opaque
stringData:
  # JWT secret — generate with: openssl rand -hex 32
  APP_SECRET: "CHANGE_ME_GENERATE_WITH_OPENSSL_RAND_HEX_32"
  # Admin password bcrypt hash — generate with:
  # node -e "const bcrypt = require('bcryptjs'); console.log(bcrypt.hashSync('your_password', 10));"
  ADMIN_PASSWORD_HASH: "$2a$10$CHANGE_ME_GENERATE_BCRYPT_HASH"
  # External API keys
  PEXELS_API_KEY: "your_pexels_key"
  PIXABAY_API_KEY: "your_pixabay_key"
  YOUTUBE_API_KEY: "your_youtube_key"
  COVERR_API_KEY: "your_coverr_key"

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ambienttv-ingress
  namespace: ambienttv
  annotations:
    # cert-manager — автоматический Let's Encrypt
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    # nginx ingress controller
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "60"
    # Rate limiting через nginx (дополнительный слой)
    nginx.ingress.kubernetes.io/limit-rps: "10"
    nginx.ingress.kubernetes.io/limit-connections: "5"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - ambienttv.example.com
      secretName: ambienttv-tls
  rules:
    - host: ambienttv.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ambienttv-backend
                port:
                  number: 80

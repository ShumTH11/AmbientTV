apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "ambienttv.fullname" . }}-config
  labels:
    {{- include "ambienttv.labels" . | nindent 4 }}
data:
  PORT: "{{ .Values.config.port | default 3000 }}"
  ALLOWED_ORIGINS: {{ .Values.config.allowedOrigins | quote }}
  SQLITE_DIR: {{ .Values.config.sqliteDir | quote }}
  REDIS_URL: "redis://{{ include "ambienttv.fullname" . }}-redis:6379"
  NODE_ENV: {{ .Values.config.nodeEnv | quote }}
  LOG_LEVEL: {{ .Values.config.logLevel | quote }}

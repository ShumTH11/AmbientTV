apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ambienttv-network-policy
  namespace: ambienttv
spec:
  podSelector:
    matchLabels:
      app: ambienttv-backend
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Разрешаем входящий трафик только от ingress controller
    - from:
        - namespaceSelector:
            matchLabels:
              name: ingress-nginx
      ports:
        - protocol: TCP
          port: 3000
  egress:
    # Разрешаем исходящий трафик только к Redis
    - to:
        - podSelector:
            matchLabels:
              app: ambienttv-redis
      ports:
        - protocol: TCP
          port: 6379
    # Разрешаем DNS
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
    # Разрешаем HTTPS к внешним API (Pexels, Pixabay, YouTube, Coverr)
    - to: []
      ports:
        - protocol: TCP
          port: 443

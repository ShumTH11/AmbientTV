<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#050508">
<title>AmbientTV — Ambient Experience</title>
<link rel="stylesheet" href="css/styles.css">
<link rel="manifest" href="manifest.json">
</head>
<body>

<!-- Auth Modal -->
<div id="authModal" class="modal hidden">
  <div class="modal-box" style="max-width:400px">
    <h2 id="authTitle">🔐 Вход</h2>
    <div id="authTabs">
      <button class="tab-btn active" onclick="switchAuthTab('login')" id="tab-login">Вход</button>
      <button class="tab-btn" onclick="switchAuthTab('register')" id="tab-register">Регистрация</button>
    </div>
    <div id="authFormLogin">
      <label>Email</label>
      <input type="email" id="loginEmail" placeholder="you@example.com">
      <label>Пароль</label>
      <input type="password" id="loginPassword" placeholder="••••••">
      <button onclick="doLogin()">Войти</button>
    </div>
    <div id="authFormRegister" class="hidden">
      <label>Имя</label>
      <input type="text" id="regName" placeholder="Ваше имя">
      <label>Email</label>
      <input type="email" id="regEmail" placeholder="you@example.com">
      <label>Пароль</label>
      <input type="password" id="regPassword" placeholder="Минимум 6 символов">
      <button onclick="doRegister()">Создать аккаунт</button>
    </div>
    <p id="authError" class="error-text"></p>
  </div>
</div>

<!-- Loading Screen -->
<div id="loader" class="loader">
  <div class="loader-inner">
    <div class="loader-logo">🌌</div>
    <div class="loader-title">AmbientTV</div>
    <div class="loader-sub">Загрузка атмосферы…</div>
  </div>
</div>

<!-- Main App -->
<div id="app" class="hidden">
  <header class="app-header">
    <div class="brand">
      <span class="logo">🌌</span>
      <h1>AmbientTV</h1>
    </div>
    <nav>
      <button class="nav-btn active" onclick="showSection('browse')" id="nav-browse">Категории</button>
      <button class="nav-btn" onclick="showSection('favorites')" id="nav-favorites">❤ Избранное</button>
      <button class="nav-btn" onclick="showSection('history')" id="nav-history">📜 История</button>
      <button class="nav-btn" onclick="showSection('profile')" id="nav-profile">👤 Профиль</button>
    </nav>
    <div class="user-badge" id="userBadge" onclick="toggleAuthModal()">
      <span id="userName">Войти</span>
    </div>
  </header>

  <!-- Browse -->
  <section id="sec-browse">
    <div id="smartSuggestion" class="smart-card hidden" onclick="openSmart()"></div>
    <div class="section-title">Выберите настроение</div>
    <div id="categoriesGrid" class="grid"></div>
  </section>

  <!-- Favorites -->
  <section id="sec-favorites" class="hidden">
    <div class="section-title">Ваше избранное</div>
    <div id="favoritesGrid" class="grid"></div>
    <p id="favEmpty" class="empty hidden">Нет избранных пар. Добавляйте сердечком в плеере.</p>
  </section>

  <!-- History -->
  <section id="sec-history" class="hidden">
    <div class="section-title">История просмотров</div>
    <div id="historyList" class="list"></div>
    <p id="histEmpty" class="empty hidden">История пуста. Начните смотреть — записи появятся здесь.</p>
  </section>

  <!-- Profile -->
  <section id="sec-profile" class="hidden">
    <div class="section-title">Личный кабинет</div>
    <div class="settings-card" id="profileCard">
      <div class="profile-header">
        <div class="profile-avatar">👤</div>
        <div class="profile-info">
          <h3 id="profileName">Гость</h3>
          <p id="profileEmail" style="color:#64748b;font-size:13px">—</p>
        </div>
      </div>
      <div class="profile-stats" id="profileStats">
        <div class="stat-box"><div class="stat-num" id="statFav">0</div><div class="stat-label">Избранное</div></div>
        <div class="stat-box"><div class="stat-num" id="statHist">0</div><div class="stat-label">Просмотров</div></div>
      </div>
      <div class="setting-row" style="margin-top:20px">
        <label>Таймер сна</label>
        <div class="setting-control">
          <select id="sleepTimer">
            <option value="0">Выключен</option>
            <option value="15">15 минут</option>
            <option value="30">30 минут</option>
            <option value="60">1 час</option>
            <option value="90">1.5 часа</option>
            <option value="120">2 часа</option>
          </select>
        </div>
      </div>
      <div class="setting-row">
        <label>Громкость аудио</label>
        <div class="setting-control">
          <input type="range" id="volumeSlider" min="0" max="100" value="80">
          <span id="volumeValue">80%</span>
        </div>
      </div>
      <button onclick="saveSettings()" class="save-btn">💾 Сохранить настройки</button>
      <button onclick="logout()" class="save-btn" style="background:#ef4444;margin-top:10px">🚪 Выйти</button>
    </div>
  </section>

  <footer class="app-footer">
    <span>AmbientTV</span>
    <span style="color:#475569">•</span>
    <a href="/admin" target="_blank">Admin</a>
  </footer>
</div>

<div id="toast"></div>

<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/app.js"></script>
<script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('/sw.js').catch(() => {});
  }
</script>
</body>
</html>

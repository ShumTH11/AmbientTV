# Fly.io deployment configuration for AmbientTV Backend
# Docs: https://fly.io/docs/reference/configuration/

app = 'ambienttv-backend'
primary_region = 'waw'

[build]
  dockerfile = 'Dockerfile'

[env]
  PORT = '3000'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
